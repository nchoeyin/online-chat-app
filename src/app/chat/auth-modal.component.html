@if (ui.authModalOpen()) {
  <div
    (click)="onBackdropClick($event)"
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4 backdrop-blur-sm"
    role="dialog"
    aria-modal="true"
    aria-labelledby="auth-modal-title"
  >
    <app-auth-card
      mode="login"
      [showClose]="true"
      (close)="ui.closeAuth()"
      (authenticated)="ui.closeAuth()"
    />
  </div>
}
